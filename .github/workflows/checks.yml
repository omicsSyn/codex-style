name: Offline regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated behavioral tests
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Check command entry points
        run: |
          python3 -B scripts/maintain.py --help
          python3 -B scripts/codex-style --help
          python3 -B scripts/automation.py --help
          python3 -B scripts/auto.py --help
          python3 -B scripts/watch.py --help
          python3 -B scripts/update.py --help
